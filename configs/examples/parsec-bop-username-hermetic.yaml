# parsec Configuration - BOP Username Hermetic Testing
#
# For testing the BOP user enrichment flow (RHCLOUD-49474 + RHCLOUD-49475)
# without external dependencies. All HTTP calls are stubbed with fixtures.
#
# Usage:
#   ./bin/parsec serve --config ./configs/examples/parsec-bop-username-hermetic.yaml
#
# Token exchange (form-encoded):
#   curl -s -X POST http://localhost:8080/v1/token \
#     -H "Content-Type: application/x-www-form-urlencoded" \
#     -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
#     -d "subject_token=testuser" \
#     -d "subject_token_type=urn:redhat:params:oauth:token-type:username" \
#     -d "requested_token_type=urn:redhat:params:oauth:token-type:rh-identity"
#
# Token exchange (JSON):
#   curl -s -X POST http://localhost:8080/v1/token \
#     -H "Content-Type: application/json" \
#     -d '{
#       "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
#       "subject_token": "testuser",
#       "subject_token_type": "urn:redhat:params:oauth:token-type:username",
#       "requested_token_type": "urn:redhat:params:oauth:token-type:rh-identity"
#     }'
#
# Decode the x-rh-identity envelope:
#   curl -s ... | jq -r .access_token | base64 -d | jq .

server:
  grpc_port: 9090
  http_port: 8080

observability:
  type: logging
  log_level: debug
  log_format: json

trust_domain: "parsec.example.com"

exchange_server:
  claims_filter:
    type: stub

# Fixtures replace real HTTP calls with canned BOP responses
fixtures:
  # BOP /v1/users fixture — returns a single user for any POST
  - type: http_rule
    request:
      method: POST
      url: "https://backoffice-proxy.example.com/v1/users.*"
      url_type: pattern
    response:
      status: 200
      headers:
        Content-Type: application/json
      body: |
        [
          {
            "org_id": 54321,
            "id": 98765,
            "account_number": "540155",
            "email": "testuser@redhat.com",
            "first_name": "Test",
            "last_name": "User",
            "is_org_admin": true,
            "is_internal": false,
            "is_active": true,
            "locale": "en_US",
            "username": "testuser"
          }
        ]

trust_store:
  type: stub_store
  validators:
    - name: trusted-username
      type: lua_validator
      credential_types: ["username"]
      script_file: ./configs/scripts/trusted_username.lua
      config:
        trust_domain: "username.redhat.com"
        issuer: "urn:redhat:names:identity:username"

data_sources:
  - name: identity-policy
    type: static
    data:
      internal_idp_target: "https://sso.redhat.com/auth/realms/internal"
      role_fallback_enabled: true

  - name: bop
    type: lua
    script_file: ./configs/scripts/bop_user.lua
    config:
      bop_url: "https://backoffice-proxy.example.com"
      users_path: "/v1/users"
      api_token: "hermetic-test-token"
      client_id: "hermetic-test-client"
      environment: "stage"
    http:
      timeout: 30s
    caching:
      type: in_memory
      ttl: 5m

issuers:
  - token_type: "urn:redhat:params:oauth:token-type:rh-identity"
    type: unsigned
    claim_mappers:
      - type: cel
        name: redhat-identity-mapper
        script_file: ./configs/scripts/redhat_identity.cel
